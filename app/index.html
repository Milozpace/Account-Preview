<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f4f0" />
    <meta name="color-scheme" content="light" />
    <title>生活账本</title>
  </head>
  <body>
    <div id="app" hidden>
      <div class="app-frame">
        <header class="site-header app-header">
          <a class="brand" href="#main"><span class="brand-symbol" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>生活账本<small>PERSONAL FINANCE</small></span></a>
          <h1 id="mobile-root-title" class="mobile-root-title" hidden>分析</h1>
          <div class="header-controls">
            <label class="month-select"><span class="sr-only">查看月份</span><select id="month-selector" aria-label="查看月份" disabled></select><span aria-hidden="true">⌄</span></label>
            <button id="desktop-sync" class="toolbar-button" type="button">同步展示</button>
            <button id="settings-button" class="toolbar-button" type="button" aria-label="更多入口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
          </div>
        </header>
        <div id="status-bar" role="status" aria-live="polite"></div>
        <main id="main" tabindex="-1"></main>
        <footer class="app-footer"><span>让数字回到生活里。</span><button id="back-to-top" class="quiet-button" type="button">回到顶部 ↑</button></footer>
      </div>
      <nav class="bottom-nav" aria-label="主导航">
        <button type="button" data-view="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m3 10 9-7 9 7v10H3zM9 20v-7h6v7"/></svg><span>总览</span></button>
        <button type="button" data-view="analysis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M4 4v16h17M8 16V9m5 7V5m5 11v-5"/></svg><span>分析</span></button>
        <button type="button" data-view="my"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg><span>我的</span></button>
      </nav>
    </div>
    <section id="pairing-scan" hidden role="dialog" aria-modal="true" aria-labelledby="pairing-scan-title">
      <div class="pairing-scan-header"><button id="cancel-pairing-scan" type="button" aria-label="返回配对页面">‹ 返回</button><h1 id="pairing-scan-title">扫码配对</h1></div>
      <div class="pairing-scan-hint"><p>将电脑上的配对二维码放入画面</p><p id="pairing-scan-status" role="status" aria-live="polite"></p></div>
    </section>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
