[package]
name = "account-app-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
aes = { version = "0.8", features = ["zeroize"] }
# Feature unification enables supported nested-library erasure; aes-gcm's
# zeroize feature alone does not forward these features. See README limits.
ghash = { version = "=0.5.1", features = ["zeroize"] }
polyval = { version = "=0.6.2", features = ["zeroize"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"

# Keep this technical spike independently testable from the Tauri host.
[workspace]
