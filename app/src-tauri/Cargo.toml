[package]
name = "app"
version = "0.4.0-preview.1"
description = "Account Preview for Windows, macOS and Android"
authors = ["Account"]
repository = ""
edition = "2024"
rust-version = "1.90"
# The diagnostic CLI in src/bin must not shadow the main binary.
default-run = "app"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"
# Native HTTPS transport for Nutstore WebDAV. Redirects are disabled by the
# client so credentials can never follow a cross-origin hop.
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
account-app-core = { path = "../core" }
tauri-plugin-platform = { path = "../plugins/platform" }
tauri-plugin-barcode-scanner = "2"
tempfile = "3"
zeroize = "1"
quick-xml = "=0.42.0"
base64 = "0.22"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Android only: JVM access for rustls-platform-verifier initialization and
# the ndk-context handle Tauri's activity lifecycle registers on startup.
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.22", default-features = false }
ndk-context = "0.1"
# Called directly for the one-time JVM/Context initialization that reqwest's
# platform verifier needs before any HTTPS request on Android. Version is
# resolved by the workspace lockfile; the matching Kotlin component comes
# from Gradle (see gen/android).
rustls-platform-verifier = "0.7.1"
