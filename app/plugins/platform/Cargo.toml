[package]
name = "tauri-plugin-platform"
version = "0.1.0"
authors = [ "Account" ]
description = ""
edition = "2024"
rust-version = "1.90"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-platform"

[dependencies]
tauri = { version = "2.12.1", default-features = false }
serde = "1.0"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
tempfile = "3"
sha2 = "0.10"
zeroize = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", default-features = false }
sha2 = "0.10"
zeroize = "1"

[target.'cfg(target_os = "android")'.dependencies]
base64 = "0.22"
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-plugin = { version = "2.7.1", features = ["build"] }
