name: Verify private preview
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to verify (all runs the complete matrix)
        type: choice
        default: all
        options: [all, windows-x64, macos-arm64, macos-x64, android-arm64]
  push:
    branches: [main, 'codex/**']
    paths-ignore: ['**/*.md', 'templates/**', '.github/ISSUE_TEMPLATE/**']
  pull_request:
    paths-ignore: ['**/*.md', 'templates/**', '.github/ISSUE_TEMPLATE/**']
permissions:
  contents: read
concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select-platforms:
    runs-on: ubuntu-24.04
    outputs:
      desktop: ${{ steps.matrix.outputs.desktop }}
    steps:
      - id: matrix
        shell: python
        env:
          REQUESTED: ${{ inputs.platform || 'all' }}
        run: |
          import json, os
          targets = [
              dict(os='windows-2022', platform='windows-x64', target='x86_64-pc-windows-msvc', bundles='nsis'),
              dict(os='macos-15', platform='macos-arm64', target='aarch64-apple-darwin', bundles='dmg'),
              dict(os='macos-15-intel', platform='macos-x64', target='x86_64-apple-darwin', bundles='dmg'),
          ]
          requested = os.environ['REQUESTED']
          selected = [t for t in targets if requested == 'all' or t['platform'] == requested]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('desktop=' + json.dumps(selected) + '\n')
  desktop:
    needs: select-platforms
    if: needs.select-platforms.outputs.desktop != '[]'
    # bash -e stops immediately on every failing native command on all runners.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-platforms.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.runtime/native-target
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock
          npm --prefix dashboard ci --ignore-scripts --no-audit --no-fund
          npm --prefix app ci --ignore-scripts --no-audit --no-fund
      - name: Create isolated macOS test Keychain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p .runtime
          security create-keychain -p preview-ci "$PWD/.runtime/preview-ci.keychain-db"
          security set-keychain-settings -lut 3600 "$PWD/.runtime/preview-ci.keychain-db"
          security unlock-keychain -p preview-ci "$PWD/.runtime/preview-ci.keychain-db"
          security default-keychain -s "$PWD/.runtime/preview-ci.keychain-db"
          security list-keychains -d user -s "$PWD/.runtime/preview-ci.keychain-db"
      - name: Test ledger, onboarding and UI
        run: |
          python -m unittest discover -s tests
          npm --prefix dashboard test
          npm --prefix app test
          npm --prefix dashboard run build
      - name: Test encryption core
        run: cargo test --manifest-path app/core/Cargo.toml --locked
      - name: Compile native storage tests
        run: cargo test --manifest-path app/plugins/platform/Cargo.toml --locked --no-run
      - name: Unlock isolated macOS test Keychain before native storage
        if: runner.os == 'macOS'
        run: |
          security show-keychain-info "$PWD/.runtime/preview-ci.keychain-db"
          security unlock-keychain -p preview-ci "$PWD/.runtime/preview-ci.keychain-db"
      - name: Test native storage without unattended prompts
        timeout-minutes: 3
        run: cargo test --manifest-path app/plugins/platform/Cargo.toml --locked -- --test-threads=1
      - name: Test native application
        run: cargo test --manifest-path app/src-tauri/Cargo.toml --locked -- --test-threads=1
      - name: Test managed first-run environment on Mac
        if: runner.os == 'macOS'
        run: sh ./bootstrap.sh --apply
      - name: Test managed first-run environment on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./bootstrap.ps1 --apply
      - name: Build native application and companions
        working-directory: app
        run: |
          npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
          cargo build --manifest-path src-tauri/Cargo.toml --locked --release --target ${{ matrix.target }} --bins
      - name: Assemble platform bundle
        shell: python
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          BUNDLES: ${{ matrix.bundles }}
        run: |
          from pathlib import Path
          import os, subprocess
          target = Path(os.environ['CARGO_TARGET_DIR']) / os.environ['TARGET'] / 'release'
          ext = '*.exe' if os.environ['BUNDLES'] == 'nsis' else '*.dmg'
          installers = list((target / 'bundle' / os.environ['BUNDLES']).glob(ext))
          assert len(installers) == 1, installers
          output = 'dist/Account-Preview-0.4.0-preview.1-' + os.environ['PLATFORM'] + '.zip'
          subprocess.run(['python','scripts/release.py','bundle','--platform',os.environ['PLATFORM'],
                          '--binaries',str(target),'--installer',str(installers[0]),'--output',output],check=True)
          subprocess.run(['python','scripts/release.py','audit'],check=True)
      - uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
  android:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'all' || inputs.platform == 'android-arm64'
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.runtime/android-target
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install build dependencies
        run: |
          sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          npm --prefix dashboard ci --ignore-scripts --no-audit --no-fund
          npm --prefix app ci --ignore-scripts --no-audit --no-fund
          cargo fetch --manifest-path app/src-tauri/Cargo.toml --locked
      - name: Build unsigned arm64 APK
        working-directory: app
        run: |
          npm run tauri -- android init --ci --skip-targets-install
          npm run tauri -- android build --ci --target aarch64 --apk
          cd src-tauri/gen/android
          sh ./gradlew :tauri-plugin-platform:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: preview-android-arm64-unsigned
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14
